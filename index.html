<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login Page</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: sans-serif; display: flex; flex-direction: column; align-items: center; padding-top: 50px; }
        input { display: block; margin: 10px; padding: 8px; width: 250px; }
        button { padding: 8px 20px; cursor: pointer; }
        #message { margin-top: 20px; font-weight: bold; color: green; }
    </style>
</head>
<body>

    <h2>Login test 2</h2>
    <input type="email" id="email" placeholder="Email Address">
    <input type="password" id="password" placeholder="Password">
    <button onclick="signUp()">Sign Up</button>
    <button onclick="signIn()">Sign In</button>

    <div id="message"></div>

    <script>
    // 1. Initialize Supabase exactly once
    const SUPABASE_URL = 'https://xjxwniomwrtcisayoeyj.supabase.co';
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InhqeHduaW9td3J0Y2lzYXlvZXlqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODI0Mjc2NDMsImV4cCI6MjA5ODAwMzY0M30.6K-ViMwz2--e9TZ8QnX6xsXk8_r_4gbUtxEyxFgvIA0';
    
    // Check if it's already initialized to avoid the error
    const supabase = window.supabase ? window.supabase : supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    const msgDiv = document.getElementById('message');

    // 2. Define signUp
    async function signUp() {
        const email = document.getElementById('email').value;
        const password = document.getElementById('password').value;
        
        const { error } = await supabase.auth.signUp({ email, password });
        
        if (error) {
            msgDiv.style.color = 'red';
            msgDiv.innerText = error.message;
        } else {
            msgDiv.style.color = 'green';
            msgDiv.innerText = 'Success! Check your email to verify.';
        }
    }

    // 3. Define signIn
    async function signIn() {
        const email = document.getElementById('email').value;
        const password = document.getElementById('password').value;
        
        const { error } = await supabase.auth.signInWithPassword({ email, password });
        
        if (error) {
            msgDiv.style.color = 'red';
            msgDiv.innerText = error.message;
        } else {
            msgDiv.style.color = 'green';
            msgDiv.innerText = 'Success! You are logged in.';
        }
    }
</script>

</body>
</html>
