<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login Page</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: sans-serif; display: flex; flex-direction: column; align-items: center; padding-top: 50px; }
        input { display: block; margin: 10px; padding: 8px; width: 250px; }
        button { padding: 8px 20px; cursor: pointer; }
    </style>
</head>
<body>

    <h2>Login / Sign Up</h2>
    <input type="email" id="email" placeholder="Email Address">
    <input type="password" id="password" placeholder="Password">
    <button onclick="signUp()">Sign Up</button>
    <button onclick="signIn()">Sign In</button>

    <script>
        // 1. Initialize Supabase
        const SUPABASE_URL = 'YOUR_PROJECT_URL_HERE';
        const SUPABASE_KEY = 'YOUR_ANON_PUBLIC_KEY_HERE';
        const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        // 2. Sign Up function
        async function signUp() {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            
            const { data, error } = await supabase.auth.signUp({ email, password });
            
            if (error) alert(error.message);
            else alert('Check your email for the verification link!');
        }

        // 3. Sign In function
        async function signIn() {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            
            const { data, error } = await supabase.auth.signInWithPassword({ email, password });
            
            if (error) alert(error.message);
            else alert('Login successful!');
        }
    </script>
</body>
</html>
